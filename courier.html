<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة المندوب - Courier Task View</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { emerald: { 500: '#10b981', 400: '#34d399' } } } }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion } = window.Motion;

        const SCRIPT_URL = "ضع_رابط_الـWeb_App_الخاص_بـAppScript_هنا";
        const COURIER_NAME = "شهاب سلامة";

        function CourierView() {
            const [activeTask, setActiveTask] = useState(null);
            const [loading, setLoading] = useState(true);

            const fetchTask = async () => {
                try {
                    const res = await fetch(`${SCRIPT_URL}?fetchTaskFor=${encodeURIComponent(COURIER_NAME)}`);
                    const data = await res.json();
                    setActiveTask(data.activeTask);
                } catch(e) { console.error(e); }
                finally { setLoading(false); }
            };

            useEffect(() => { fetchTask(); }, []);

            const startTask = async () => {
                if(!activeTask) return;
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'start_task', taskId: activeTask.taskId })
                });
                fetchTask();
            };

            return (
                <div className="max-w-2xl mx-auto p-6">
                    {/* Vehicle Card */}
                    <motion.div 
                        initial={{ opacity: 0, y: -20 }}
                        animate={{ opacity: 1, y: 0 }}
                        className="relative overflow-hidden rounded-3xl p-6 mb-6 bg-gradient-to-r from-slate-900 to-slate-950 border border-emerald-500/30 shadow-2xl"
                    >
                        <div className="relative z-10 max-w-xs">
                            <span className="text-xs bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-bold">
                                مركبة النقل والعمليات
                            </span>
                            <h2 className="text-2xl font-black text-emerald-400 mt-3">Volkswagen Transporter</h2>
                            <p className="text-xs text-slate-400 mt-1">مجهزة لنقل الآلات الطبية والمعقمات</p>
                        </div>

                        {/* صورة الشاحنة المرفوعة عندك على GitHub */}
                        <motion.img 
                            initial={{ x: 60 }} 
                            animate={{ x: 0 }}
                            transition={{ duration: 0.5 }}
                            src="./van-transporter.png" 
                            alt="Truck" 
                            className="absolute left-2 bottom-0 w-48 md:w-56 object-contain drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)]"
                            onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1559297434-fae8a1916a79?auto=format&fit=crop&w=400&q=80' }}
                        />
                    </motion.div>

                    {/* Active Task Details */}
                    <div className="p-6 rounded-3xl bg-slate-900 border border-slate-800 shadow-xl space-y-4">
                        <h3 className="text-lg font-bold text-emerald-400 flex justify-between items-center">
                            المهمة الحالية 📍
                            {activeTask && (
                                <span className="text-xs bg-emerald-500/10 border border-emerald-500/30 px-3 py-1 rounded-full">
                                    {activeTask.status}
                                </span>
                            )}
                        </h3>

                        {loading ? (
                            <p className="text-center py-6 opacity-50">جاري التحقق من المهام...</p>
                        ) : activeTask ? (
                            <div className="space-y-4">
                                <div className="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-2">
                                    <div className="text-sm"><span className="opacity-50">المستشفى: </span><strong className="text-emerald-400 text-base">{activeTask.hospitalName}</strong></div>
                                    <div className="text-sm"><span className="opacity-50">نوع العملية: </span><strong>{activeTask.caseType}</strong></div>
                                    <div className="text-xs p-3 bg-slate-900 rounded-xl text-slate-300 border border-slate-800">
                                        <strong>محتويات الشنطة: </strong>{activeTask.bagContents}
                                    </div>
                                </div>

                                <a 
                                    href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(activeTask.hospitalName)}`}
                                    target="_blank"
                                    className="block w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-center font-bold rounded-2xl transition"
                                >
                                    🗺️ فتح موقع المستشفى على Google Maps
                                </a>

                                {activeTask.status === 'PENDING' && (
                                    <button 
                                        onClick={startTask}
                                        className="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-2xl transition"
                                    >
                                        بدء التحرك للتسليم 🚀
                                    </button>
                                )}
                            </div>
                        ) : (
                            <p className="text-center py-6 opacity-50">لا يوجد مهام معلقة لك حالياً من المشرف.</p>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CourierView />);
    </script>
</body>
</html>
