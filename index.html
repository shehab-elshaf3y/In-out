<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Viewport الأساسي للتجاوب مع الموبايل -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- PWA & Mobile Settings -->
  <meta name="theme-color" content="#06110d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vita Shop">

  <!-- App Icons -->
  <link rel="icon" type="image/png" sizes="512x512" href="./icon512.png">
  <link rel="apple-touch-icon" sizes="512x512" href="./icon512.png">

  <!-- Manifest Link -->
  <link rel="manifest" href="./manifest.json">

  <title>Vita Shop</title>
  
  <!-- باقي أكواد الـ <style> الخاصة بك هنا -->
</head>
 <style>
  :root {
    --bg-dark: #06110d;
    --panel-bg: rgba(12, 31, 24, 0.65);
    --emerald-primary: #10b981;
    --emerald-glow: #059669;
    --emerald-dark: #022c22;
    --text-main: #ecfdf5;
    --text-muted: #6ee7b7;
    --glass-border: rgba(16, 185, 129, 0.2);
  }

  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
  
  body {
    background: #040d0a;
    background-image: 
      radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(5, 150, 105, 0.12) 0px, transparent 50%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    padding: 15px;
  }

  /* 1. الشاشة الترحيبية (Splash Screen) */
  #splash-screen {
    position: fixed;
    inset: 0;
    background: var(--bg-dark);
    z-index: 999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  .splash-logo {
    width: 110px;
    height: 110px;
    background: linear-gradient(135deg, var(--emerald-primary), var(--emerald-dark));
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 50px rgba(16, 185, 129, 0.5);
    animation: pulseGlow 2s infinite alternate ease-in-out;
  }
  .splash-title {
    margin-top: 24px;
    font-size: 1.8rem;
    letter-spacing: 2px;
    color: var(--text-main);
    font-weight: 700;
    opacity: 0;
    animation: fadeInUp 1s 0.3s forwards;
  }

  /* 2. الحاوية الرئيسية */
  .app-card {
    width: 100%;
    max-width: 950px;
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(16, 185, 129, 0.1);
    display: flex;
    overflow: hidden;
    position: relative;
  }

  .company-logo-top {
    position: absolute;
    top: 20px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }
  .logo-icon-small {
    width: 38px;
    height: 38px;
    background: var(--emerald-primary);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #000;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
  }

  .art-side {
    flex: 1;
    background: linear-gradient(180deg, rgba(6, 78, 59, 0.3) 0%, rgba(2, 44, 34, 0.6) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    border-left: 1px solid var(--glass-border);
  }
  .avatar-preview-box {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 3px solid var(--emerald-primary);
    box-shadow: 0 0 40px rgba(16, 185, 129, 0.3);
    overflow: hidden;
    margin-bottom: 20px;
    background: #021f18;
    transition: transform 0.3s ease;
  }
  .avatar-preview-box img { width: 100%; height: 100%; object-fit: cover; }

  .form-side {
    flex: 1.2;
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .nav-tabs {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1.05rem;
    font-weight: 600;
    padding-bottom: 6px;
    cursor: pointer;
    position: relative;
    transition: color 0.3s;
  }
  .tab-btn.active { color: var(--emerald-primary); }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 100%;
    height: 3px;
    background: var(--emerald-primary);
    border-radius: 2px;
    box-shadow: 0 0 10px var(--emerald-primary);
  }

  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
  input, select {
    width: 100%;
    padding: 12px 14px;
    background: rgba(4, 20, 15, 0.7);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.3s;
  }
  input:focus, select:focus {
    border-color: var(--emerald-primary);
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .avatar-selector { display: flex; gap: 10px; margin-top: 8px; }
  .avatar-opt {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 2px solid transparent;
    cursor: pointer;
    overflow: hidden;
    opacity: 0.6;
    transition: all 0.2s;
  }
  .avatar-opt.selected, .avatar-opt:hover {
    border-color: var(--emerald-primary);
    opacity: 1;
    transform: translateY(-2px);
  }
  .avatar-opt img { width: 100%; height: 100%; object-fit: cover; }

  .btn-submit {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    background: linear-gradient(135deg, var(--emerald-primary), var(--emerald-glow));
    border: none;
    border-radius: 12px;
    color: #022c22;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
    transition: all 0.3s;
  }

  .id-badge {
    background: rgba(16, 185, 129, 0.1);
    border: 1px dashed var(--emerald-primary);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    color: var(--emerald-primary);
    text-align: center;
    margin-top: 6px;
  }

  #status-msg {
    margin-top: 15px;
    padding: 10px;
    border-radius: 10px;
    font-size: 0.88rem;
    text-align: center;
    display: none;
  }
  .msg-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid var(--emerald-primary); }
  .msg-error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
  .msg-info { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }

  @keyframes pulseGlow {
    from { box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); transform: scale(0.98); }
    to { box-shadow: 0 0 60px rgba(16, 185, 129, 0.7); transform: scale(1.05); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive Fix للموبايل */
  @media (max-width: 850px) {
    body {
      align-items: flex-start;
      padding: 10px;
    }
    .app-card { 
      flex-direction: column; 
      border-radius: 20px;
      margin-top: 10px;
    }
    .art-side { 
      border-left: none; 
      border-bottom: 1px solid var(--glass-border); 
      padding: 25px 15px; 
    }
    .form-side {
      padding: 25px 18px;
    }
    .avatar-preview-box { width: 120px; height: 120px; margin-bottom: 10px; }
    .grid-2 { grid-template-columns: 1fr; gap: 0; }
  }
/* Farvex Badge Styling (Desktop - Bottom Left) */
.farvex-badge {
  position: fixed;
  bottom: 16px;
  left: 16px;
  z-index: 9999;
  display: inline-flex;
  align-items: center;
  opacity: 0.85;
  transition: opacity 0.3s ease, transform 0.3s ease;
  text-decoration: none;
}
.farvex-badge img {
  height: 24px;
  width: auto;
  display: block;
}
.farvex-badge:hover {
  opacity: 1;
}

/* Farvex Badge Responsive (Mobile - Bottom Center) */
@media (max-width: 768px) {
  .farvex-badge {
    bottom: calc(16px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
  }
  .farvex-badge:hover {
    opacity: 0.85;
  }
  .farvex-badge img {
    height: 20px;
  }
}
</style>
</head>
<body>

  <!-- 1. الشاشة الترحيبية (Splash Screen) -->
  <div id="splash-screen">
    <div class="splash-logo">
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="splash-title">Welcome to Vita Shop</div>
  </div>

  <!-- 2. بطاقة الواجهة الزجاجية -->
  <div class="app-card">
    
    <!-- اللوجو أعلى اليسار -->
    <div class="company-logo-top">
      <div class="logo-icon-small">🚀</div>
      <span style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">Vita Shop</span>
    </div>

    <!-- الجانب الأيسر: عرض الأفاتار والمركز -->
    <div class="art-side">
      <div class="avatar-preview-box">
        <img id="main-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Cyber1" alt="Avatar">
      </div>
      <h3 id="display-role" style="color: var(--text-main); font-weight: 600;">موظف جديد</h3>
      <p id="display-id-preview" style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">ID: --</p>
    </div>

    <!-- الجانب الأيمن: النماذج -->
    <div class="form-side">
      <div class="nav-tabs" id="main-tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">تسجيل الدخول</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">إنشاء حساب (أول مرة)</button>
      </div>

      <!-- نموذج تسجيل الدخول (Default) -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>كود الموظف (Employee ID) أو رقم الهاتف</label>
          <input type="text" id="login-key" placeholder="مثال: AA-34567 أو 0101234..." required>
        </div>
        <div class="form-group">
          <label>رمز PIN السرية</label>
          <input type="password" id="login-pin" placeholder="••••" maxlength="6" inputmode="numeric" required>
        </div>
        <div style="text-align: left; margin-top: -5px; margin-bottom: 15px;">
          <a href="#" onclick="openResetPinSection(event)" style="color: #00d2d3; font-size: 13px; text-decoration: none;">
            نسيت الـ PIN / تغيير الـ PIN؟
          </a>
        </div>
        <button type="submit" class="btn-submit">دخول النظام</button>
      </form>

     <div style="text-align: left; margin-top: -5px; margin-bottom: 15px;">
  <span style="color: var(--text-muted); font-size: 13px;">
    نسيت الـ PIN؟ يرجى التواصل مع الآدمن لإعادة تعيينه.
  </span>
</div>

      <!-- نموذج إنشاء حساب جديد -->
      <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
        <div class="grid-2">
          <div class="form-group">
            <label>الاسم الأول (En)</label>
            <input type="text" id="reg-fname" placeholder="Ahmed" oninput="updateIDPreview()" required>
          </div>
          <div class="form-group">
            <label>اسم الأب (En)</label>
            <input type="text" id="reg-lname" placeholder="Ali" oninput="updateIDPreview()" required>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="reg-phone" placeholder="010..." required>
          </div>
          <div class="form-group">
            <label>الرقم القومي (14 رقم)</label>
            <input type="text" id="reg-nationalid" maxlength="14" placeholder="299..." oninput="updateIDPreview()" required>
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>المركز الوظيفي</label>
            <select id="reg-role" onchange="changeRoleAvatar(this.value)">
              <option value="CEO">CEO</option>
              <option value="HR">HR</option>
              <option value="محاسب">محاسب</option>
              <option value="مراقب مخزون">مراقب مخزون</option>
              <option value="دعم فني ">دعم فني</option>
              <option value="تنسيق">تنسيق</option>
              <option value="أمين مخزن">أمين مخزن</option>
              <option value="مسؤول الات">مسؤول الات</option>
              <option value="مندوب توصيل">مندوب توصيل</option>
            </select>
          </div>
          <div class="form-group">
            <label>رمز PIN (كلمة السر)</label>
            <input type="password" id="reg-pin" placeholder="••••" maxlength="6" inputmode="numeric" required>
          </div>
        </div>

        <!-- اختيار صورة الأفاتار -->
        <div class="form-group">
          <label>اختر صورة الأفاتار الخاصة بك</label>
          <div class="avatar-selector">
            <div class="avatar-opt selected" onclick="selectAvatar(this, 'Cyber1')">
              <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Cyber1" alt="1">
            </div>
            <div class="avatar-opt" onclick="selectAvatar(this, 'Cyber2')">
              <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Cyber2" alt="2">
            </div>
            <div class="avatar-opt" onclick="selectAvatar(this, 'Cyber3')">
              <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Cyber3" alt="3">
            </div>
            <div class="avatar-opt" onclick="selectAvatar(this, 'Cyber4')">
              <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Cyber4" alt="4">
            </div>
          </div>
        </div>

        <div class="id-badge" id="generated-id-box">كود الموظف المتوقع: XX-XXXXX</div>

        <button type="submit" class="btn-submit">تأكيد وانشاء الحساب</button>
      </form>

      <div id="status-msg"></div>
    </div>

  </div>
<!-- Farvex Badge -->
<a href="#" onclick="return false;" class="farvex-badge">
  <img src="powered_by_farvex.png" alt="Powered by Farvex">
</a>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzA2MrVa_IXt_RHlVhpYnCTTEgjz5_LvrUKaflRFOnCL7Qy3QQOLGSBd7Y7AxCrQto/exec";
    let selectedAvatarSeed = 'Cyber1';

    // 1. التحكم في الشاشة الترحيبية
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';
        setTimeout(() => splash.style.visibility = 'hidden', 800);
      }, 1800);
    });

    // 2. التبديل بين التبويبات (Login / Register)
    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('form-reset-pin').style.display = 'none'; // إخفاء نموذج التعيين عند التبديل
      
      hideStatus();
    }

    // 3. تحديث الأفاتار والـ ID المعاين حياً
    function updateIDPreview() {
      const f = document.getElementById('reg-fname').value.trim().charAt(0).toUpperCase() || 'X';
      const l = document.getElementById('reg-lname').value.trim().charAt(0).toUpperCase() || 'X';
      const nid = document.getElementById('reg-nationalid').value.trim();
      const last5 = nid.length >= 5 ? nid.slice(-5) : 'XXXXX';
      
      const generatedId = `${f}${l}-${last5}`;
      document.getElementById('generated-id-box').innerText = `كود الموظف المولد: ${generatedId}`;
      document.getElementById('display-id-preview').innerText = `ID: ${generatedId}`;
    }

    function selectAvatar(el, seed) {
      document.querySelectorAll('.avatar-opt').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
      selectedAvatarSeed = seed;
      const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${seed}`;
      document.getElementById('main-avatar').src = avatarUrl;
    }

    function changeRoleAvatar(role) {
  document.getElementById('display-role').innerText = role + " (طلب معلق)";

    }

    // 4. معالجة التسجيل
    function handleRegister(e) {
      e.preventDefault();
      showStatus('جاري تسجيل بياناتك وإنشاء الحساب...', 'info');

      const payload = {
        action: 'register',
        firstNameEn: document.getElementById('reg-fname').value,
        fatherNameEn: document.getElementById('reg-lname').value,
        phone: document.getElementById('reg-phone').value,
        nationalId: document.getElementById('reg-nationalid').value,
        pin: document.getElementById('reg-pin').value,
        role: document.getElementById('reg-role').value,
        avatarUrl: `https://api.dicebear.com/7.x/bottts/svg?seed=${selectedAvatarSeed}`
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
       if (data.success) {
        showStatus(data.message, 'success');
        localStorage.setItem('userSession', JSON.stringify(data));
        setTimeout(() => {
          alert('تم إرسال طلب إنشاء الحساب بنجاح! سيقوم الآدمن بمراجعة طلبك والموافقة على الصلاحية قبل التمكن من تسجيل الدخول.');
          switchTab('login');
        }, 2000);
      } else {
          showStatus(data.message, 'error');
        }
      })
      .catch(() => showStatus('حدث خطأ في الاتصال بالخادم.', 'error'));
    }

    // 5. معالجة تسجيل الدخول
    // 5. معالجة تسجيل الدخول
// 5. معالجة تسجيل الدخول
// 5. معالجة تسجيل الدخول (مُعدّلة ومضمونة التوجيه)
// 5. معالجة تسجيل الدخول (مُعدّلة ومضمونة التوجيه)
function handleLogin(e) {
  e.preventDefault();
  showStatus('جاري التحقق من بيانات الدخول...', 'info');

  const loginKey = document.getElementById('login-key').value.trim();
  const loginPin = document.getElementById('login-pin').value.trim();

  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action: 'login', loginKey: loginKey, pin: loginPin })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      showStatus(data.message, 'success');

      const emp = data.employee || {};
      const userRole = String(emp.role).trim();
      const userName = emp.name;

      // تخزين البيانات في localStorage
      localStorage.setItem('authToken', data.token); 
      localStorage.setItem('userSession', JSON.stringify(emp));
      localStorage.setItem('userName', userName);
      localStorage.setItem('userRole', userRole);

      setTimeout(() => {
        const roleLower = userRole.toLowerCase();

        // التوجيه بناءً على مصفوفة الـ Roles
        if (['admin'].includes(roleLower)) {
            window.location.href = './admin.html';
        } 
        else if (['مندوب توصيل', 'مندوب عمليات', 'مندوب'].includes(roleLower)) {
            window.location.href = './delivery.html';
        } 
        else if (['ceo'].includes(roleLower)) {
            window.location.href = './ceo.html';
        } 
        else if (['supervisor', 'تنسيق', 'مشرف'].includes(roleLower)) {
            window.location.href = './supervisor.html';
        }
        else if (['أمين مخزن', 'مخزن'].includes(roleLower)) {
            window.location.href = './inventory.html';
        } 
          else if (['مسؤول الات'].includes(roleLower)) {
            window.location.href = './machines.html';
             }
        else {
            // توجيه افتراضي لأي دور آخر
            window.location.href = './employee.html';
        }
      }, 2000);
      
    } else {
      showStatus(data.message, 'error');
    }
  })
  .catch(err => showStatus('حدث خطأ في الاتصال بالخادم.', 'error'));
}

    // 6. دوال إظهار وإخفاء الحالة (Status Messages)
    function showStatus(text, type) {
      const el = document.getElementById('status-msg');
      if (type === 'success') el.className = 'msg-success';
      else if (type === 'info') el.className = 'msg-info';
      else el.className = 'msg-error';
      
      el.innerText = text;
      el.style.display = 'block';
    }

    function hideStatus() {
      document.getElementById('status-msg').style.display = 'none';
    }

    // 7. دالة فتح قسم تغيير الـ PIN
    function openResetPinSection(e) {
      if (e) e.preventDefault();
      document.getElementById("form-login").style.display = "none";
      document.getElementById("form-register").style.display = "none";
      document.getElementById("form-reset-pin").style.display = "block";
      hideStatus();
    }

    // 8. دالة إرسال الـ PIN الجديد للـ Backend
    async function handlePinResetSubmit(e) {
      if (e) e.preventDefault();
      
      const empId = document.getElementById("empIdInput").value;
      const newPin = document.getElementById("newPinInput").value;

      showStatus("جاري تحديث الـ PIN...", "info");

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "resetPin",
            employeeId: empId,
            newPin: newPin
          })
        });

        const result = await response.json();
        if (result.success) {
          showStatus(result.message, "success");
          setTimeout(() => {
            switchTab('login');
          }, 2000);
        } else {
          showStatus(result.message, "error");
        }
      } catch (error) {
        showStatus("حدث خطأ في الاتصال بالخادم", "error");
      }
    }
  </script>
</body>
</html>
