<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة مندوب التوصيل والعمليات - Vita Shop</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --sidebar-bg: #111827;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-green: #34d399;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 80px; background-color: var(--sidebar-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 20px; z-index: 100; }
        @media (max-width: 768px) {
            body { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 65px; flex-direction: row; justify-content: space-around; border-left: none; border-top: 1px solid var(--border-color); padding: 0 10px; }
            .sidebar-logo { display: none; }
            .main-container { padding: 15px; height: calc(100vh - 65px); }
            .grid-2 { grid-template-columns: 1fr; }
        }
        .sidebar-logo img { width: 40px; height: 40px; object-fit: contain; margin-bottom: 20px; }
        .nav-icon { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); transition: all 0.3s ease; font-size: 20px; background: transparent; border: none; }
        .nav-icon:hover, .nav-icon.active { background-color: rgba(52, 211, 153, 0.15); color: var(--accent-green); }
        .main-container { flex: 1; padding: 30px; overflow-y: auto; background: radial-gradient(circle at top right, #064e3b15, transparent 50%); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--card-bg); backdrop-filter: blur(10px); padding: 15px 25px; border-radius: 16px; border: 1px solid var(--border-color); }
        .header-title h2 { margin: 0; font-size: 20px; color: var(--text-main); }
        .header-title p { margin: 5px 0 0 0; font-size: 13px; color: var(--text-muted); }
        .tab-content { display: none; } .tab-content.active { display: block; }
        .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; margin-bottom: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .card-title { font-size: 16px; font-weight: bold; color: var(--accent-green); margin-bottom: 15px; border-right: 3px solid var(--accent-green); padding-right: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
        input, select { width: 100%; padding: 12px; background-color: rgba(2, 44, 34, 0.4); border: 1px solid var(--border-color); border-radius: 10px; color: white; font-size: 14px; box-sizing: border-box; }
        input:focus, select:focus { outline: none; border-color: var(--accent-green); }
        .btn-row { display: flex; gap: 15px; }
        .action-btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; color: white; }
        .btn-in { background: linear-gradient(135deg, #059669, #10b981); } .btn-out { background: linear-gradient(135deg, #dc2626, #ef4444); }
        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #059669, #34d399); color: #0b0f19; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .chart-container { position: relative; height: 240px; width: 100%; }
        @media (min-width: 768px) { .chart-container { height: 320px; } }
    </style>
</head>
<body>

        <button class="nav-icon active" onclick="switchTab('dashboard', this)" title="لوحة المؤشرات">📊</button>

        <button class="nav-icon" onclick="window.location.href='./delivery_app.html'" title="فتح تطبيق المندوب المحمول">📱</button>

                    <div class="chart-container">

                </div>

                    <p style="color: var(--text-muted); font-size: 14px; line-height: 1.6;">

                    </p>
                    <div style="background: rgba(52,211,153,0.05); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); margin-top: 20px; text-align: center;">
                        <span style="font-size: 24px; font-weight: bold; color: var(--accent-green);" id="totalTasksCount">--</span>
                        <div style="font-size: 13px; color: var(--text-muted); margin-top: 5px;">حركاتك المسجلة</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tasks" class="tab-content">
            <div class="card" style="max-width: 600px; margin: 0 auto;">
                <div class="card-title">نموذج تسجيل حركة جديدة</div>
                <form id="deliveryForm">
                    <div class="form-group">
                        <label>تاريخ العملية</label>
                        <input type="date" name="exitDate" required>
                    </div>
                    <div class="form-group">
                        <label>اسم المستشفى</label>
                        <input type="text" name="hospitalName" placeholder="اكتب اسم المستشفى هنا" required>
                    </div>
                    <div class="form-group">
                        <label>نوع الحالة</label>
                        <select name="caseType" required>
                            <option value="">اختر نوع الحالة</option>

                        </select>

    <script>
        // UX & Persistance (Security Boundary is Server-Side)
        let sessionData = {};
        try {
            sessionData = JSON.parse(localStorage.getItem('userSession') || '{}');
        } catch (e) {
            localStorage.removeItem('userSession');
        }
        const authToken = localStorage.getItem('authToken');
        
        if (!authToken) {
            alert('⚠️ يجب تسجيل الدخول أولاً.');
            window.location.href = './index.html';
        }

        const currentEmployee = sessionData.name || 'موظف';
        const userRole = sessionData.role || 'غير محدد';
        document.getElementById('employeeWelcome').innerText = `مرحباً بك، ${currentEmployee} (${userRole})`;

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-icon').forEach(icon => icon.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
            const titles = { 'dashboard': 'لوحة المؤشرات والرسوم البيانية', 'attendance': 'تسجيل الحضور والانصراف', 'tasks': 'تسجيل الحركة والعمليات' };
            document.getElementById('pageTitle').innerText = titles[tabId];
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userSession');
            window.location.href = './index.html';
        }

        const scriptURL = 'https://script.google.com/macros/s/AKfycbw8Inba4420QVP9RkWDQcrkU4WARU9QJR6uN5z1Hw17mE9vxytVZ2L-YBQly-S0Oii8/exec';

        const ctx = document.getElementById('dailyActivityChart').getContext('2d');
        let dailyChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'],
                datasets: [{ label: 'عدد العمليات', data: [0, 0, 0, 0, 0, 0, 0], backgroundColor: '#34d399', borderRadius: 8 }]
            },
            options: {
                responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                scales: { x: { ticks: { color: '#9ca3af' }, grid: { display: false } }, y: { ticks: { color: '#9ca3af' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true } }
            }
        });

        function loadDashboardData() {
            fetch(`${scriptURL}?token=${encodeURIComponent(authToken)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.result === 'error' || (!data.success && data.message)) {
                        if (data.message.includes('Unauthorized') || data.message.includes('expired')) logout();
                        return;
                    }
                    if (data.totalOperations !== undefined) document.getElementById('totalTasksCount').innerText = data.totalOperations;
                    if (data.chartData) {
                        dailyChart.data.datasets[0].data = [
                            data.chartData["السبت"] || 0, data.chartData["الأحد"] || 0, data.chartData["الإثنين"] || 0,
                            data.chartData["الثلاثاء"] || 0, data.chartData["الأربعاء"] || 0, data.chartData["الخميس"] || 0, data.chartData["الجمعة"] || 0
                        ];
                        dailyChart.update();
                    }
                })
                .catch(err => console.error('Error fetching dashboard.'));
        }
        loadDashboardData();

        let isProcessing = false;

       document.getElementById('overtimeForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formatTo24 = (timeStr, ampm) => {
    let parts = timeStr.split(':');
    let h = parseInt(parts[0]);
    let m = parts[1];
    
    if (ampm === "PM" && h < 12) h += 12;
    if (ampm === "AM" && h === 12) h = 0;
    
    return `${h.toString().padStart(2, '0')}:${m}`; 
};
    const inTime = formatTo24(document.getElementById('inHour').value, document.getElementById('inAmPm').value);
    const outTime = formatTo24(document.getElementById('outHour').value, document.getElementById('outAmPm').value);

    const payload = {
        action: 'manual_attendance',
        token: authToken,
        inTime: inTime,
        outTime: outTime
    };

   fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) })
    .then(res => res.json())
    .then(data => {
        if (data.result === 'success') {
            alert('تم التسجيل بنجاح!');
        } else {
            alert('خطأ: ' + (data.message || 'فشل التسجيل'));
        }
    })
    .catch(err => alert('خطأ في الاتصال بالخادم'));
});

        const form = document.getElementById('deliveryForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = '🔄 جاري الحفظ...';

            const formData = new FormData(form);
            const payload = Object.fromEntries(formData.entries());
            payload.action = 'task';
            payload.token = authToken;

            fetch(scriptURL, { 
                method: 'POST',
               
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    alert('✅ تم حفظ الحركة بنجاح!');
                    form.reset();
                    loadDashboardData();
                } else if (data.result === 'dispute_detected') {
                    alert('⚠️ تنبيه: تم رصد تكرار في الـ OP وتم التوثيق بنجاح وإرسال إشعار للإدارة!');
                    form.reset();
                    loadDashboardData();
                } else {
                    if (data.message && data.message.includes('Unauthorized')) logout();
                    alert(`❌ ${data.message || 'حدث خطأ'}`);
                }
                submitBtn.disabled = false; submitBtn.innerText = 'حفظ وإرسال الحركة للشيت';
            })
            .catch(error => {
                alert('حدث خطأ في الاتصال بالخادم.');
                submitBtn.disabled = false; submitBtn.innerText = 'حفظ وإرسال الحركة للشيت';
            });
        });
    </script>
</body>
</html>
